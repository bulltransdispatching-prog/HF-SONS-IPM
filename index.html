<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#003d7a">
<meta name="description" content="HF SONS AND SOLUTIONS - Integrated Pest Management System">
<title>HF SONS – IPM System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--p:#003d7a;--ps:#002b55;--g:#28a745;--r:#dc3545;--o:#fd7e14;--pu:#6f42c1;--y:#ffc107}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{background:#f0f2f5;color:#333;min-height:100vh}
.hide{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:3px}

/* Toast */
#toastBox{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:320px}
.toast{background:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 6px 24px rgba(0,0,0,.15);display:flex;align-items:center;gap:10px;animation:slideIn .3s;cursor:pointer;border-left:4px solid #ccc}
.toast.success{border-left-color:var(--g)}.toast.error{border-left-color:var(--r)}.toast.info{border-left-color:var(--p)}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Connection Badge */
#connBadge{position:fixed;bottom:16px;right:16px;z-index:9998;padding:8px 14px;border-radius:20px;font-size:.75rem;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.1)}
#connBadge.online{background:#d4edda;color:#155724}
#connBadge.offline{background:#f8d7da;color:#721c24}
#connBadge.connecting{background:#fff3cd;color:#856404}
.conn-dot{width:8px;height:8px;border-radius:50%}
.online .conn-dot{background:var(--g);animation:pulse 2s infinite}
.offline .conn-dot{background:var(--r)}
.connecting .conn-dot{background:var(--y);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Login */
#loginPage{min-height:100vh;background:linear-gradient(135deg,#003d7a,#001a3d);display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:20px;padding:40px 32px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.login-logo{width:70px;height:70px;background:linear-gradient(135deg,var(--p),var(--ps));border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 24px rgba(0,61,122,.4)}
.login-logo i{font-size:2rem;color:#fff}
.login-box h2{text-align:center;font-weight:900;font-size:1.7rem;margin-bottom:4px}
.login-box h2 .h{color:#1a73e8}.login-box h2 .f{color:#6c757d}
.login-box .sub{text-align:center;color:#666;font-size:.9rem}
.login-box .tagline{text-align:center;color:#999;font-style:italic;font-size:.8rem;margin:8px 0 24px}
.login-box .db-info{text-align:center;font-size:.7rem;color:#aaa;margin-top:20px;padding:10px;background:#f8f9fa;border-radius:8px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-weight:700;font-size:.8rem;color:#555;text-transform:uppercase;margin-bottom:6px}
.form-control{width:100%;border:2px solid #e0e0e0;border-radius:12px;padding:12px 16px;font-size:1rem;background:#f8f9fa;outline:none;transition:all .2s}
.form-control:focus{border-color:var(--p);background:#fff;box-shadow:0 0 0 3px rgba(0,61,122,.1)}
.input-group{position:relative}
.input-group .form-control{padding-right:48px}
.input-group-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#aaa;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.input-group-btn:hover{background:#f0f0f0;color:#666}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;border:none;transition:all .2s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--p),var(--ps));color:#fff;box-shadow:0 4px 14px rgba(0,61,122,.3)}
.btn-primary:hover{box-shadow:0 6px 20px rgba(0,61,122,.4);transform:translateY(-1px)}
.btn-success{background:var(--g);color:#fff}
.btn-success:hover{background:#218838}
.btn-danger{background:var(--r);color:#fff}
.btn-danger:hover{background:#c82333}
.btn-warning{background:var(--y);color:#333}
.btn-orange{background:var(--o);color:#fff}
.btn-purple{background:var(--pu);color:#fff}
.btn-sm{padding:8px 14px;font-size:.82rem}
.btn-xs{padding:6px 10px;font-size:.75rem;border-radius:8px}
.btn-outline{background:#fff;border:2px solid}
.btn-outline-primary{border-color:var(--p);color:var(--p)}
.btn-outline-primary:hover{background:var(--p);color:#fff}
.btn-outline-success{border-color:var(--g);color:var(--g)}
.btn-outline-success:hover{background:var(--g);color:#fff}
.btn-outline-danger{border-color:var(--r);color:var(--r)}
.btn-outline-danger:hover{background:var(--r);color:#fff}
.btn-outline-orange{border-color:var(--o);color:var(--o)}
.btn-outline-orange:hover{background:var(--o);color:#fff}
.btn-outline-purple{border-color:var(--pu);color:var(--pu)}
.btn-outline-purple:hover{background:var(--pu);color:#fff}
.btn-full{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}

/* Alerts */
.alert{padding:12px 16px;border-radius:10px;font-size:.88rem;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.alert-danger{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
.alert-info{background:#cce5ff;color:#004085;border:1px solid #b8daff}
.alert-success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.alert-warning{background:#fff3cd;color:#856404;border:1px solid #ffeeba}

/* App Layout */
#mainApp{display:flex;min-height:100vh}

/* Sidebar */
#sidebar{width:260px;background:linear-gradient(180deg,#003d7a 0%,#001a3d 100%);color:#fff;position:fixed;height:100vh;z-index:100;display:flex;flex-direction:column;transition:transform .3s ease;overflow:hidden}
#sidebar.closed{transform:translateX(-260px)}
.sidebar-header{padding:20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px}
.sidebar-logo{width:44px;height:44px;background:rgba(255,255,255,.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.sidebar-header h4{margin:0;font-size:1.15rem;font-weight:900}
.sidebar-header h4 .h{color:#fff}.sidebar-header h4 .f{color:#adb5bd}
.sidebar-header small{color:rgba(255,255,255,.5);font-size:.7rem;display:block;margin-top:2px}
.nav-menu{flex:1;overflow-y:auto;padding:10px 0}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 20px;color:rgba(255,255,255,.7);cursor:pointer;border-left:3px solid transparent;transition:all .2s;font-size:.9rem;font-weight:600}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--y)}
.nav-item i{width:22px;text-align:center;font-size:.95rem}
.sidebar-footer{padding:15px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:.72rem;color:rgba(255,255,255,.4);text-align:center}
.sidebar-footer a{color:rgba(255,255,255,.6);text-decoration:none}
.sidebar-footer a:hover{color:#fff}

/* Main Content */
#mainContent{flex:1;margin-left:260px;display:flex;flex-direction:column;min-height:100vh;transition:margin .3s ease}
#mainContent.full{margin-left:0}

/* Topbar */
#topbar{background:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.06);position:sticky;top:0;z-index:50;border-bottom:1px solid #f0f0f0}
#menuToggle{background:none;border:none;font-size:1.4rem;color:var(--p);cursor:pointer;padding:8px;border-radius:8px;display:flex;align-items:center;justify-content:center}
#menuToggle:hover{background:#f0f4ff}
.user-info-bar{display:flex;align-items:center;gap:14px}
.user-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--ps));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.1rem;box-shadow:0 3px 10px rgba(0,61,122,.3)}
.user-details{text-align:right}
.user-name{font-weight:700;font-size:.95rem;color:#333}
.user-role{font-size:.72rem;color:#999}
.logout-btn{padding:8px 16px;border:2px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer;font-size:.8rem;font-weight:700;color:#666;display:flex;align-items:center;gap:6px;transition:all .2s}
.logout-btn:hover{color:var(--r);border-color:var(--r);background:#fff5f5}

/* Page Content */
.page-content{padding:24px;flex:1}
.page-title{font-size:1.4rem;font-weight:900;color:#222;margin-bottom:24px;display:flex;align-items:center;gap:12px}
.page-title i{color:var(--p);font-size:1.2rem}

/* Cards */
.card{background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,.06);margin-bottom:20px;overflow:hidden}
.card-header{background:var(--p);color:#fff;padding:16px 20px;font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-header i{margin-right:8px}
.card-header.green{background:var(--g)}.card-header.orange{background:var(--o)}.card-header.purple{background:var(--pu)}.card-header.gray{background:#495057}
.card-body{padding:20px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:14px;padding:20px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 12px rgba(0,0,0,.05);border:1px solid #f5f5f5;transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.stat-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#fff;flex-shrink:0}
.stat-icon.blue{background:linear-gradient(135deg,#667eea,var(--p))}
.stat-icon.green{background:linear-gradient(135deg,#11998e,#38ef7d)}
.stat-icon.orange{background:linear-gradient(135deg,var(--o),#dc3545)}
.stat-icon.purple{background:linear-gradient(135deg,#4facfe,#00f2fe)}
.stat-icon.red{background:linear-gradient(135deg,#f5576c,#f093fb)}
.stat-val{font-size:2rem;font-weight:900;color:#222;line-height:1}
.stat-lbl{font-size:.8rem;color:#888;margin-top:4px}

/* Tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.9rem}
thead tr{background:#f8f9fa;border-bottom:2px solid #e9ecef}
th{padding:14px 16px;font-weight:700;color:#555;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;text-align:left;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid #f0f0f0;color:#444;vertical-align:middle}
tbody tr:hover{background:#f8fbff}
tbody tr:last-child td{border-bottom:none}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap}
.badge-green{background:#d4edda;color:#155724}.badge-red{background:#f8d7da;color:#721c24}
.badge-blue{background:#d0e7ff;color:#004080}.badge-orange{background:#ffe8d4;color:#7d3f00}
.badge-purple{background:#e9d8ff;color:#4a1dab}.badge-gray{background:#e9ecef;color:#495057}
.badge-yellow{background:#fff3cd;color:#664d03}

/* Forms */
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:16px}
.form-group-i{margin-bottom:0}
.form-group-i label{display:block;font-size:.75rem;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
.form-group-i input,.form-group-i select,.form-group-i textarea{width:100%;border:2px solid #e0e0e0;border-radius:10px;padding:11px 14px;font-size:.9rem;background:#fafafa;outline:none;transition:all .2s}
.form-group-i input:focus,.form-group-i select:focus,.form-group-i textarea:focus{border-color:var(--p);background:#fff;box-shadow:0 0 0 3px rgba(0,61,122,.08)}
.form-group-i textarea{resize:vertical;min-height:80px}
.form-check{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.9rem;font-weight:600;color:#555}
.form-check input[type=checkbox]{width:18px;height:18px;accent-color:var(--p);cursor:pointer}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:6px;background:#e8f0fe;color:var(--p);padding:5px 12px;border-radius:20px;font-size:.8rem;font-weight:700}
.tag-remove{background:none;border:none;cursor:pointer;color:var(--p);font-size:1.1rem;padding:0;line-height:1;opacity:.7}
.tag-remove:hover{opacity:1;color:var(--r)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:all .25s ease}
.modal-overlay.show{opacity:1;visibility:visible}
.modal-box{background:#fff;border-radius:20px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.3);transform:scale(.9) translateY(20px);transition:transform .25s ease}
.modal-overlay.show .modal-box{transform:scale(1) translateY(0)}
.modal-sm{max-width:420px}.modal-md{max-width:560px}.modal-lg{max-width:760px}.modal-xl{max-width:960px}
.modal-header{padding:20px 24px;border-radius:20px 20px 0 0;display:flex;align-items:center;justify-content:space-between}
.modal-header.blue{background:var(--p)}.modal-header.green{background:var(--g)}.modal-header.orange{background:var(--o)}.modal-header.purple{background:var(--pu)}.modal-header.yellow{background:var(--y)}.modal-header.gray{background:#495057}
.modal-header h5{color:#fff;font-weight:700;font-size:1.1rem;margin:0;display:flex;align-items:center;gap:10px}
.modal-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center;transition:background .2s}
.modal-close:hover{background:rgba(255,255,255,.3)}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 24px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* Form Cards */
.forms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.form-card{background:#fff;border-radius:16px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s;border:2px solid transparent;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.form-card:hover{border-color:var(--p);transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,61,122,.15)}
.form-card i{font-size:2.4rem;color:var(--p);margin-bottom:12px;display:block}
.form-card.custom-card i{color:var(--pu)}
.form-card h6{font-weight:700;font-size:.9rem;color:#333;margin:0 0 4px}
.form-card small{font-size:.72rem;color:#aaa}

/* GPS Box */
.loc-box{padding:16px 20px;border-radius:12px;display:flex;align-items:center;gap:14px;margin-bottom:16px;border:2px solid}
.loc-box.wait{background:#e8f4ff;border-color:#74b9ff}
.loc-box.ok{background:#d4edda;border-color:var(--g)}
.loc-box.fail{background:#f8d7da;border-color:var(--r)}
.loc-box i{font-size:1.8rem}

/* Signature */
.sig-wrap{border:2px dashed #ccc;border-radius:12px;overflow:hidden;background:#fafafa;cursor:crosshair}
.sig-wrap canvas{width:100%;display:block;touch-action:none}
.sig-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sig-label{font-size:.75rem;font-weight:700;color:#666;text-transform:uppercase}
.sig-clear{font-size:.75rem;color:var(--r);cursor:pointer;background:none;border:none;font-weight:700}
.sig-clear:hover{text-decoration:underline}

/* Report */
.report-wrap{background:#fff;max-width:850px;margin:0 auto;font-size:.9rem}
.report-hdr{background:var(--p);color:#fff;padding:24px 28px}
.report-hdr h2{font-size:1.3rem;font-weight:900;margin:0 0 4px}
.report-hdr small{color:rgba(255,255,255,.7)}
.report-ref{background:rgba(255,255,255,.15);padding:5px 14px;border-radius:20px;font-size:.75rem;font-weight:700}
.report-title-bar{background:#e8f0fe;border-left:4px solid var(--p);padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.report-title-bar h4{font-size:1.05rem;font-weight:900;color:var(--p);margin:0;display:flex;align-items:center;gap:8px}
.report-body{padding:24px 28px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#f8f9fa;padding:18px;border-radius:12px;margin-bottom:20px;border-left:4px solid var(--p)}
.info-item label{font-size:.7rem;text-transform:uppercase;color:#999;font-weight:700;display:block;margin-bottom:3px}
.info-item span{font-weight:700;color:#333;font-size:.9rem}
.sum-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.sum-card{background:#f8f9fa;padding:16px;text-align:center;border-radius:12px;border-left:3px solid var(--p)}
.sum-val{font-size:1.8rem;font-weight:900;color:var(--p)}
.sum-lbl{font-size:.72rem;color:#999;margin-top:2px}

/* Low Stock */
.low-stock-bar{background:#fff5f5;border:2px solid #f5c6cb;border-radius:14px;padding:18px 20px;margin-bottom:20px;display:flex;align-items:flex-start;gap:16px}
.low-stock-bar i{font-size:1.8rem;color:var(--r);flex-shrink:0}

/* Overlay */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
#overlay.show{display:block}

/* Loading */
#loadingScreen{position:fixed;inset:0;background:linear-gradient(135deg,#003d7a,#001a3d);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9000;color:#fff}
#loadingScreen i.main-icon{font-size:4.5rem;margin-bottom:20px;animation:bounce .8s infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-15px)}}
#loadingScreen h2{font-size:2rem;font-weight:900;margin-bottom:8px}
#loadingScreen h2 .h{color:#fff}
#loadingScreen h2 .f{color:#adb5bd}
#loadingScreen .loading-text{color:rgba(255,255,255,.6);display:flex;align-items:center;gap:10px;font-size:.95rem}
#loadingScreen .tagline{color:rgba(255,255,255,.5);font-style:italic;margin-top:12px;font-size:.9rem}
#loadingScreen .db-url{color:rgba(255,255,255,.3);font-size:.7rem;margin-top:20px;font-family:monospace}

/* Responsive */
@media(max-width:768px){
  #sidebar{transform:translateX(-260px)}
  #sidebar.open{transform:translateX(0)}
  #mainContent{margin-left:0!important}
  .stats-grid{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
  .forms-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .info-grid{grid-template-columns:1fr}
  .user-details{display:none}
}

/* Print */
@media print{
  #sidebar,#topbar,#overlay,.no-print,#toastBox,#connBadge,.modal-overlay{display:none!important}
  #mainContent{margin-left:0!important}
  .page-content{padding:0!important}
  body{background:#fff!important}
  .card{box-shadow:none!important;border:1px solid #ddd}
}
</style>
</head>
<body>

<div id="toastBox"></div>
<div id="connBadge" class="connecting" onclick="showDbInfo()">
  <div class="conn-dot"></div>
  <span id="connText">Connecting...</span>
</div>
<div id="overlay"></div>

<!-- Loading Screen -->
<div id="loadingScreen">
  <i class="fas fa-bug main-icon"></i>
  <h2><span class="h">H</span><span class="f">F</span> SONS</h2>
  <p class="loading-text"><i class="fas fa-spinner fa-spin"></i> Connecting to database...</p>
  <p class="tagline">"Making Better to Best"</p>
  <p class="db-url" id="loadingDbUrl"></p>
</div>

<!-- Login Page -->
<div id="loginPage" class="hide">
  <div class="login-box">
    <div class="login-logo"><i class="fas fa-bug"></i></div>
    <h2><span class="h">H</span><span class="f">F</span> SONS</h2>
    <p class="sub">Integrated Pest Management</p>
    <p class="tagline">"Making Better to Best"</p>
    <div id="loginError" class="alert alert-danger hide"></div>
    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" id="loginUser" class="form-control" placeholder="Enter username" autocomplete="username">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-group">
        <input type="password" id="loginPass" class="form-control" placeholder="Enter password" autocomplete="current-password">

function calculateDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ==================== SIGNATURE PAD ====================
const signatureData = {};

function initSignaturePad(canvasId) {
  const canvas = $(canvasId);
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#1a1a2e';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';

  signatureData[canvasId] = { drawing: false, lastPos: { x: 0, y: 0 } };

  const getPosition = e => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  };

  const startDrawing = e => {
    e.preventDefault();
    signatureData[canvasId].drawing = true;
    signatureData[canvasId].lastPos = getPosition(e);
  };

  const draw = e => {
    e.preventDefault();
    if (!signatureData[canvasId].drawing) return;
    const pos = getPosition(e);
    ctx.beginPath();
    ctx.moveTo(signatureData[canvasId].lastPos.x, signatureData[canvasId].lastPos.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    signatureData[canvasId].lastPos = pos;
  };

  const stopDrawing = () => {
    signatureData[canvasId].drawing = false;
  };

  canvas.onmousedown = canvas.ontouchstart = startDrawing;
  canvas.onmousemove = canvas.ontouchmove = draw;
  canvas.onmouseup = canvas.onmouseleave = canvas.ontouchend = stopDrawing;
}

function clearSignature(canvasId) {
  const canvas = $(canvasId);
  if (canvas) {
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  }
}

function getSignatureData(canvasId) {
  const canvas = $(canvasId);
  if (!canvas) return '';
  const ctx = canvas.getContext('2d');
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const hasContent = Array.from(imageData).some(pixel => pixel !== 0);
  return hasContent ? canvas.toDataURL() : '';
}

function checkGPSLocation() {
  const box = $('gpsStatusBox');
  const retryBtn = $('retryGpsBtn');
  const project = STATE.selectedProject;

  box.className = 'loc-box wait';
  box.innerHTML = `
    <i class="fas fa-spinner fa-spin" style="color:#007bff;font-size:1.8rem"></i>
    <div><strong>Getting your location...</strong><br><small>Please wait...</small></div>
  `;
  if (retryBtn) retryBtn.classList.add('hide');

  if (!navigator.geolocation) {
    showGPSError('Geolocation is not supported by your browser');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    position => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const distance = Math.round(calculateDistance(lat, lng, project.lat, project.lng));
      const radius = project.radius || 50;

      STATE.gpsLocation = { lat, lng, distance, status: distance <= radius ? 'verified' : 'failed' };

      if (distance <= radius) {
        box.className = 'loc-box ok';
        box.innerHTML = `
          <i class="fas fa-check-circle" style="color:var(--g);font-size:1.8rem"></i>
          <div>
            <strong style="color:#155724">✓ Location Verified</strong><br>
            <small>You are ${distance}m from the site (within ${radius}m radius)</small>
          </div>
        `;
        $('attendanceFields').classList.remove('hide');
        $('saveAttendanceBtn').disabled = false;
      } else {
        box.className = 'loc-box fail';
        box.innerHTML = `
          <i class="fas fa-times-circle" style="color:var(--r);font-size:1.8rem"></i>
          <div>
            <strong style="color:#721c24">✗ Too Far Away</strong><br>
            <small>You are ${distance}m from site (max: ${radius}m)</small>
          </div>
        `;
        if (retryBtn) retryBtn.classList.remove('hide');
      }
    },
    error => {
      showGPSError(error.message);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function showGPSError(message) {
  const box = $('gpsStatusBox');
  const retryBtn = $('retryGpsBtn');
  box.className = 'loc-box fail';
  box.innerHTML = `
    <i class="fas fa-exclamation-triangle" style="color:var(--r);font-size:1.8rem"></i>
    <div>
      <strong style="color:#721c24">Location Error</strong><br>
      <small>${message}</small>
    </div>
  `;
  if (retryBtn) retryBtn.classList.remove('hide');
  STATE.gpsLocation = { status: 'error', lat: 0, lng: 0, distance: 0 };
}

function saveAttendance() {
  const data = {

    userKey: currentUser.key,
    date: $('attDate').value,
    timeIn: $('attTimeIn').value,

// Area tags for insecticide form
window._formAreas = [];

function addAreaTag() {
  const input = $('newAreaInput');
  const value = input?.value?.trim();
  if (value && !window._formAreas.includes(value)) {
    window._formAreas.push(value);
    renderAreaTags();
    input.value = '';
  }
}

function removeAreaTag(index) {
  window._formAreas.splice(index, 1);
  renderAreaTags();

function renderAreaTags() {
  const container = $('areasContainer');
  if (container) {
    container.innerHTML = window._formAreas.map((area, i) => `

function saveGenericForm() {
  const date = $('fDate')?.value;
  if (!date) {
    toast('Please enter a date', 'error');
    return;
  }

  const baseData = {
    formType: STATE.currentFormType,
    projectKey: STATE.selectedProject.key,
    userKey: currentUser.key,
    date: date,
    time: $('fTime')?.value || '',
    remarks: $('fRemarks')?.value || '',
    techSignature: getSignatureData('formTechSig'),
    clientSignature: getSignatureData('formClientSig'),
    createdAt: Date.now()
  };

  if (STATE.currentFormType === 'insecticide') {
    Object.assign(baseData, {
      chemical: $('fChemical').value,
      batchNumber: $('fBatch').value,
      qty: $('fQty').value,
      water: $('fWater').value,
      remainingQty: $('fRemaining').value,
      areas: [...window._formAreas]
    });
  } else if (STATE.currentFormType === 'checklist') {
    baseData.timeIn = $('fTimeIn').value;
    baseData.timeOut = $('fTimeOut').value;
    baseData.activities = [...qsa('.checklistStatus')].map(sel => ({
      item: sel.dataset.item,
      status: sel.value
    }));
  } else if (STATE.currentFormType === 'baitstation') {
    baseData.baitBrand = $('fBaitBrand').value;
    baseData.totalStations = parseInt($('fTotalSt').value) || 0;
    baseData.activeStations = parseInt($('fActiveSt').value) || 0;
    baseData.baitUsed = $('fBaitUsed').value;
    baseData.entries = [...$('baitStationBody').rows].map((row, i) => {
      const inputs = row.querySelectorAll('input, select');
      return {
        sr: i + 1,
        location: inputs[0]?.value || '',
        stationType: inputs[1]?.value || '',
        baitConsumed: inputs[2]?.value || '0',
        baitReplaced: inputs[3]?.value || '0',
        condition: inputs[4]?.value || '',
        pestActivity: inputs[5]?.value || ''
      };
    });
  } else {
    const tbody = $('genericFormBody');
    baseData.entries = tbody ? [...tbody.rows].map((row, i) => {
      const inputs = row.querySelectorAll('input, select');
      return {
        sr: i + 1,
        location: inputs[0]?.value || '',
        count: parseInt(inputs[1]?.value) || 0,
        status: inputs[2]?.value || ''
      };
    }) : [];
  }

  window._formAreas = [];

  DB.ref('records').push(baseData)
    .then(() => {
      closeModal();
      toast('Record saved successfully!');
    })
    .catch(err => {
      console.error('Save error:', err);
      toast('Failed to save record', 'error');
    });
}

let recordsFilter = { from: '', to: '', type: '' };

  let records = [...DATA.records];

  if (currentUser.role === 'staff') {

    records = records.filter(r => r.projectKey === currentUser.projectKey);

  if (recordsFilter.from) records = records.filter(r => r.date >= recordsFilter.from);
  if (recordsFilter.to) records = records.filter(r => r.date <= recordsFilter.to);
  if (recordsFilter.type) records = records.filter(r => r.formType === recordsFilter.type);

  records.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  const formTypes = [...new Set(DATA.records.map(r => r.formType))];

function viewRecord(key) {
  const record = DATA.records.find(r => r.key === key);
  if (!record) return;

// ==================== INVENTORY ====================
function getProductsWithStock() {
  return DATA.products.map(product => {
    let stock = parseInt(product.openingStock) || 0;
    DATA.stockLogs.filter(log => log.productKey === product.key).forEach(log => {
      if (log.type === 'add') stock += parseInt(log.qty) || 0;
      else if (log.type === 'usage') stock -= parseInt(log.qty) || 0;
      else if (log.type === 'adjust') stock = parseInt(log.qty) || 0;
    });
    return { ...product, currentStock: Math.max(0, stock) };
  });
}

  const products = getProductsWithStock();
  const lowStockProducts = products.filter(p => p.active && p.currentStock < (p.minStock || 0));

                  <td>
                    ${currentUser.role === 'admin' ? `
                      <button class="btn btn-xs btn-outline-success" onclick="openStockAdjustModal('${p.key}')" title="Adjust Stock"><i class="fas fa-plus-minus"></i></button>

function saveProduct() {
  const key = $('productKey').value;
  const name = $('productName').value.trim();

  if (!name) {
    toast('Product name is required', 'error');
    return;
  }

  const data = {
    name: name,
    category: $('productCategory').value,
    unit: $('productUnit').value,
    minStock: parseInt($('productMinStock').value) || 0,
    active: $('productActive').checked,
    updatedAt: Date.now()
  };

  if (!key) {
    data.openingStock = parseInt($('productOpeningStock')?.value) || 0;
    data.createdAt = Date.now();
  }

  const ref = key ? DB.ref(`products/${key}`).update(data) : DB.ref('products').push(data);

  ref.then(() => {
    closeModal();
    toast(key ? 'Product updated!' : 'Product added!');
  }).catch(err => {
    console.error('Save error:', err);
    toast('Failed to save product', 'error');
  });
}

function deleteProduct(key) {
  if (confirm('Delete this product and all its stock logs?')) {
    DB.ref(`products/${key}`).remove();
    DATA.stockLogs.filter(l => l.productKey === key).forEach(l => {
      DB.ref(`stockLogs/${l.key}`).remove();
    });
    toast('Product deleted');
  }
}

function saveUsage() {
  const productKey = $('usageProduct').value;
  const projectKey = $('usageProject').value;

  if (!productKey || !projectKey || !qty || qty <= 0) {
    toast('Please fill all required fields', 'error');

  }

  const data = {
    productKey: productKey,
    projectKey: projectKey,

function captureCurrentLocation() {
  if (!navigator.geolocation) {
    toast('Geolocation not supported', 'error');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      $('projectLat').value = pos.coords.latitude.toFixed(6);
      $('projectLng').value = pos.coords.longitude.toFixed(6);
      toast('Location captured!');
    },
    err => {
      toast('Failed to get location: ' + err.message, 'error');
    },
    { enableHighAccuracy: true }
  );
}

                <button class="btn btn-sm btn-outline-purple" style="flex:1" onclick="openFormBuilderModal('${f.key}')"><i class="fas fa-edit"></i> Edit</button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteCustomForm('${f.key}')"><i class="fas fa-trash"></i></button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : `
      <div style="background:#fff;border:2px dashed #e0e0e0;border-radius:16px;padding:60px;text-align:center">
        <i class="fas fa-tools" style="font-size:3.5rem;color:#e0e0e0;margin-bottom:20px;display:block"></i>
        <p style="color:#bbb;font-weight:700;font-size:1.1rem">No custom forms yet</p>
        <p style="color:#ddd;font-size:.9rem">Click "New Form" to create your first custom form</p>
      </div>
    `}
  `;
}

function openFormBuilderModal(key) {
  const form = key ? DATA.customForms.find(f => f.key === key) : null;

  const html = `
    <div class="modal-header purple">
      <h5><i class="fas fa-tools"></i> ${form ? 'Edit' : 'Create'} Custom Form</h5>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="customFormKey" value="${form?.key || ''}">
      <div class="form-group-i" style="margin-bottom:16px">
        <label>Form Name *</label>
        <input type="text" id="customFormName" value="${form?.name || ''}" placeholder="e.g. Fumigation Log">
      </div>
      <div class="form-group-i" style="margin-bottom:16px">
        <label>Description</label>
        <input type="text" id="customFormDesc" value="${form?.description || ''}" placeholder="Brief description">
      </div>
      <div class="form-group-i" style="margin-bottom:16px">
        <label>Icon</label>
        <select id="customFormIcon">
          ${['file-alt', 'tasks', 'spray-can', 'box', 'clipboard-check', 'tools', 'bug', 'search', 'chart-bar', 'list-alt', 'clipboard-list', 'bell', 'flask', 'shield-alt', 'cog'].map(icon => `
            <option value="${icon}"${form?.icon === icon ? ' selected' : ''}>${icon}</option>
          `).join('')}
        </select>
      </div>
      <label class="form-check">
        <input type="checkbox" id="customFormActive" ${form?.active !== false ? 'checked' : ''}>
        <span>Active (visible in Data Entry)</span>
      </label>
      <div class="alert alert-info" style="margin-top:20px">
        <i class="fas fa-info-circle"></i> Advanced field editing coming soon. For now, forms use a standard entry table.
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-purple" onclick="saveCustomForm()"><i class="fas fa-save"></i> Save Form</button>
    </div>
  `;

  openModal(html, 'md');
}

function saveCustomForm() {
  const key = $('customFormKey').value;
  const name = $('customFormName').value.trim();

  if (!name) {
    toast('Form name is required', 'error');
    return;
  }

  const existingForm = key ? DATA.customForms.find(f => f.key === key) : null;

  const data = {
    name: name,
    description: $('customFormDesc').value.trim(),
    icon: $('customFormIcon').value,
    active: $('customFormActive').checked,
    fields: existingForm?.fields || [],
    updatedAt: Date.now()
  };

  const ref = key
    ? DB.ref(`customForms/${key}`).update(data)
    : DB.ref('customForms').push({ ...data, createdAt: Date.now() });

  ref.then(() => {
    closeModal();
    toast(key ? 'Form updated!' : 'Form created!');
  }).catch(err => {
    console.error('Save error:', err);
    toast('Failed to save form', 'error');
  });
}

function deleteCustomForm(key) {
  if (confirm('Delete this custom form?')) {
    DB.ref(`customForms/${key}`).remove()
      .then(() => toast('Form deleted'))
      .catch(() => toast('Delete failed', 'error'));
  }
}

// ==================== SETTINGS ====================
function renderSettings() {
  $('pageContent').innerHTML = `
    <div class="page-title"><i class="fas fa-cog"></i> Settings</div>

    <div style="display:grid;grid-template-columns:${currentUser.role === 'admin' ? '1fr 1fr' : '1fr'};gap:20px">
      <div class="card">
        <div class="card-header"><i class="fas fa-user"></i> My Profile</div>
        <div class="card-body">
          <div class="form-group-i" style="margin-bottom:16px">
            <label>Name</label>
            <input type="text" id="settingsName" value="${currentUser.name}">
          </div>
          <div class="form-group-i" style="margin-bottom:16px">
            <label>New Password</label>
            <input type="password" id="settingsPassword" placeholder="Leave empty to keep current">
          </div>
          <button class="btn btn-primary" onclick="saveSettings()"><i class="fas fa-save"></i> Save Changes</button>
        </div>
      </div>

      ${currentUser.role === 'admin' ? `
        <div class="card">
          <div class="card-header"><i class="fas fa-database"></i> System Information</div>
          <div class="card-body">
            <button class="btn btn-outline-success btn-full" style="margin-bottom:16px" onclick="exportAllData()">
              <i class="fas fa-download"></i> Export All Data (JSON)
            </button>

            <div style="background:#f8f9fa;border-radius:12px;padding:16px">
              <div style="font-weight:700;color:#333;margin-bottom:12px">System Info</div>
              <div style="font-size:.85rem;color:#666;line-height:2">
                <div><span style="color:#aaa">Version:</span> <strong>5.1 Production</strong></div>
                <div><span style="color:#aaa">Company:</span> <strong>${COMPANY.name}</strong></div>
                <div><span style="color:#aaa">Database:</span> <strong>${FIREBASE_CONFIG.projectId}</strong></div>
                <div><span style="color:#aaa">Users:</span> <strong>${DATA.users.length}</strong></div>
                <div><span style="color:#aaa">Projects:</span> <strong>${DATA.projects.length}</strong></div>
                <div><span style="color:#aaa">Records:</span> <strong>${DATA.records.length}</strong></div>
              </div>
            </div>
          </div>
        </div>
      ` : ''}
    </div>
  `;
}

function saveSettings() {
  const name = $('settingsName').value.trim();
  const password = $('settingsPassword').value;

  if (!name) {
    toast('Name is required', 'error');
    return;
  }

  const data = { name: name, updatedAt: Date.now() };
  if (password) {
    data.password = password;
  }

  DB.ref(`users/${currentUser.key}`).update(data)
    .then(() => {
      currentUser.name = name;
      $('topUserName').textContent = name;
      $('topUserAvatar').textContent = name.charAt(0).toUpperCase();
      toast('Settings saved!');
    })
    .catch(err => {
      console.error('Save error:', err);
      toast('Failed to save settings', 'error');
    });
}

function exportAllData() {
  const exportData = {
    company: COMPANY,
    exportedAt: new Date().toISOString(),
    exportedBy: currentUser.name,
    users: DATA.users,
    projects: DATA.projects,
    records: DATA.records,
    remarks: DATA.remarks,
    customForms: DATA.customForms,
    products: DATA.products,
    stockLogs: DATA.stockLogs
  };

  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `hfsons_backup_${getTodayStr()}.json`;
  link.click();
  URL.revokeObjectURL(url);

  toast('Data exported successfully!');
}

// ==================== INITIALIZE APP ====================
document.addEventListener('DOMContentLoaded', () => {
  setupDataListeners();
});
</script>
</body>
</html>
